logging:
  level:
    '[org.carthageking.mc.mcck]': ${APP_LOG_LEVEL:TRACE}


server:
  port: ${APP_SERVER_PORT:9091}


spring:
  jpa:
    open-in-view: false
  thymeleaf:
    enabled: true
    prefix: "classpath:/thymeleaf/views/"
    suffix: ".html"
    cache: false
    encoding: "UTF-8"
    enable-spring-el-compiler: true
  threads:
    virtual:
      enabled: true
